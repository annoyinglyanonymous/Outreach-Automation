[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests

# --strict-markers: a typo'd @pytest.mark silently does nothing otherwise.
# --cov-fail-under is a ratchet, not a target: raise it when coverage
# rises, never lower it to make a red build green.
addopts =
    --strict-markers
    --strict-config
    --cov=app
    --cov-report=term-missing:skip-covered
    --cov-fail-under=80

filterwarnings =
    # Starlette's TestClient warns on per-request cookies; the UI tests
    # need exactly that to exercise session handling.
    ignore:Setting per-request cookies:DeprecationWarning
